status:
  scope: >-
    The selected Solution theorem is dependency-closed and gives the ordinary upper
    Minkowski lower bound 597n/1000 for n at least 4. There is no Hausdorff or lower
    Minkowski conclusion. Challenge contains one intentional statement hole; the
    Solution proof sources contain no holes. Protected Comparator verification
    covers the selected endpoint; PUBLIC_VERIFICATION.json specifies its scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
